<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="google-signin-client_id"
            content="662625007473-omvhko9nmerj4slfrsu7cibeeenl6lt7.apps.googleusercontent.com"
    >

    <title>Roomify</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231A237E'/><path d='M50 20 L80 46 L72 46 L72 78 L58 78 L58 58 L42 58 L42 78 L28 78 L28 46 L20 46 Z' fill='%23FFFFFF'/><circle cx='50' cy='38' r='5' fill='%23FBBF24'/></svg>">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: transparent;
        }


        /*
         * ========================================================
         * GOOGLE MAP
         * ========================================================
         */

        #google-map-container {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: -1;

            display: none;

            visibility: hidden;

            opacity: 0;

            background: #e5e3df;

            touch-action: none;
        }


        /*
         * ========================================================
         * COMPOSE
         * ========================================================
         *
         * Compose is still present because Kotlin/Wasm needs
         * its canvas.
         *
         * But it is completely transparent on the map screen.
         *
         * Search/menu/sidebar are NOT Compose.
         */

        #ComposeTarget {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 10;

            margin: 0;
            padding: 0;

            background: #E8EEF7;
        }

        /* When Google Map is active, hide ComposeTarget completely so there is ZERO conflict between Compose WebGL canvas and native Google Maps JS */
        #ComposeTarget.map-mode {
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -1 !important;
            background: transparent !important;
        }

        #ComposeTarget,
        #ComposeTarget canvas {

            background: transparent;

            background-color: transparent;
        }

    </style>


    <!-- Google Maps (Places + Geometry loaded eagerly so Autocomplete, Geocoder & Directions are always ready) -->

    <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBLyHdlQHjeCKntbZSyoTyzK-J160-Xbvw&libraries=places,geometry">
    </script>

    <!-- Marker Clusterer -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

    <!-- Google Identity Services (Sign In With Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Roomify Google Maps implementation -->

    <script src="roomify-map.js"></script>


    <!-- Kotlin/Wasm -->

    <script src="webApp.js"></script>

</head>


<body>


<!-- Google Maps -->

<div id="google-map-container"></div>


<!-- Kotlin Compose -->

<div id="ComposeTarget"></div>


<script>

    /*
     * ========================================================
     * INITIAL MAP LAYER
     * ========================================================
     */

    function roomifySetMapLayer() {

        const map =
            document.getElementById(
                "google-map-container"
            );

        const compose =
            document.getElementById(
                "ComposeTarget"
            );

        if (!map || !compose) {
            return;
        }

        if (window.roomifyIsMapPage) {
            return;
        }

        map.style.zIndex = "-1";
        map.style.display = "none";
        map.style.visibility = "hidden";
        map.style.opacity = "0";

        compose.style.zIndex = "10";
        compose.style.visibility = "visible";
        compose.style.opacity = "1";
        compose.style.pointerEvents = "auto";
        compose.style.background = "#E8EEF7";
        compose.style.backgroundColor = "#E8EEF7";
    }

    roomifySetMapLayer();

    console.log(
        "Roomify: index.html loaded"
    );

</script>

</body>

</html>
