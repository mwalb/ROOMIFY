# Production application
spring.application.name=Roomify
server.address=0.0.0.0
server.port=8080

# Neon PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File uploads
file.upload.dir=uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=50MB

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Google authentication
google.client.id=${GOOGLE_CLIENT_ID:662625007473-omvhko9nmerj4slfrsu7cibeeenl6lt7.apps.googleusercontent.com,1041914574744-evaa3p91lu43jr5crr42esqrivkha66m.apps.googleusercontent.com}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-image}

# Email (Brevo REST API + SMTP fallback)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:c32f86001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:charlesnestory432@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:ROOMIFY}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:8082,https://roomify.co.tz,https://roomifytz-api.fly.dev,https://roomify-api.fly.dev}

# Logging
logging.level.com.ROOMIFY.Roomify=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN
