# ===============================
# APP CONFIG
# ===============================
spring.application.name=Roomify
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# ===============================
# DATABASE CONFIGURATION
# (Exported to environment variables with fallback defaults)
# ===============================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/roomifydb;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# ===============================
# SERVER OPTIMIZATIONS (Performance & Scalability)
# ===============================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# ===============================
# DATABASE CONNECTION POOLING (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===============================
# JPA / HIBERNATE PERFORMANCE
# ===============================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB
file.upload.dir=${FILE_UPLOAD_DIR:uploads}

# ===============================
# JWT CONFIGURATION (Exported to Environment)
# ===============================
jwt.secret=${JWT_SECRET:RoomifyJWTSecretKey2026UltraSecureAuthenticationSystemKeyXYZ123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# GOOGLE AUTH & GEMINI AI CONFIGURATION
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:}
gemini.api.key=${GEMINI_API_KEY:AIzaSyD7ltIeJn7lFlWw-Pqxv12ULSapm4XcTOM}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# ===============================
# LOGGING
# ===============================
logging.level.com.ROOMIFY.Roomify=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
