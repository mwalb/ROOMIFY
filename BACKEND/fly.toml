# fly.toml app configuration file generated for roomifytz-backend on 2026-11-11T22:16:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'roomifytz-backend'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.alive]
    type = 'http'
    interval = '30s'
    timeout = '10s'
    grace_period = '3m0s'
    method = 'get'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
