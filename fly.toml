# fly.toml app configuration file generated for roomify-api3 on 2026-11-28T12:40:03Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'roomify-api3'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.alive]
    port = 8080
    type = 'tcp'
    interval = '30s'
    timeout = '10s'
    grace_period = '5m0s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
